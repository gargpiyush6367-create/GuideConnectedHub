<!-- ================= PROFILE ================= -->

<section class="profile-section">

    <div class="profile-card">

        <div class="profile-image">

            <img src="assets/images/default-profile.png" alt="Expert">

        </div>

        <div class="profile-info">

            <h1 id="expertName"></h1>

            <h3 id="expertProfession"></h3>

            <p><strong>Experience:</strong> <span id="expertExperience"></span> Years</p>

            <p><strong>Meeting Fee:</strong> ₹<span id="expertFee"></span></p>

            <p id="expertDescription">
                Welcome to ExpertConnect.
            </p>

            <div class="social-links">

                <a id="linkedin" target="_blank">LinkedIn</a>

                <a id="instagram" target="_blank">Instagram</a>

            </div>

            <a href="book-meeting.html">

                <button class="book-btn">
                    Book Meeting
                </button>

            </a>

        </div>

    </div>

</section>

<section class="certificate-section">

<h2>Verification</h2>

<div class="certificate-card">

<p>

</p>

<p>
