<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Expert Interaction Hub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="register-container">

    <div class="register-left">

        <h1>Create Account</h1>

        <p>

            Join Expert Interaction Hub and connect with verified experts through secure video meetings.

        </p>

    </div>

    <div class="register-right">

        <form id="registerForm">

            <h2>Registration</h2>

            <!-- Account Type -->

            <div class="input-box">

                <label>Register As</label>

                <select id="role">

                    <option value="USER">User</option>

                    <option value="EXPERT">Expert</option>

                </select>

            </div>

            <!-- Common Fields -->

            <div class="input-box">

                <label>Full Name</label>

                <input type="text" id="name" required>

            </div>

            <div class="input-box">

                <label>Email</label>

                <input type="email" id="email" required>

            </div>

            <div class="input-box">

                <label>Password</label>

                <input type="password" id="password" required>

            </div>

            <div class="input-box">

                <label>Phone Number</label>

                <input type="tel" id="phone">

            </div>

            <div class="input-box">

                <label>Date of Birth</label>

                <input type="date" id="dob">

            </div>

            <!-- Expert Fields -->

            <div id="expertFields">

                <div class="input-box">

                    <label>Profession</label>

                    <select id="profession">

                        <option>Teacher</option>
                        <option>Doctor</option>
                        <option>Business Consultant</option>
                        <option>Influencer</option>
                        <option>Trader</option>
                        <option>Student Mentor</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Meeting Fee (₹)</label>

                    <input type="number" id="fee">

                </div>

                <div class="input-box">

                    <label>LinkedIn Profile</label>

                    <input type="url" id="linkedin">

                </div>

                <div class="input-box">

                    <label>Instagram Profile</label>

                    <input type="url" id="instagram">

                </div>

                <div class="input-box">

                    <label>UPI ID</label>

                    <input type="text" id="upi">

                </div>

                <div class="input-box">

                    <label>Upload Profile Image</label>

                    <input type="file" id="profileImage">

                </div>

                <div class="input-box">

                    <label>Upload Certificate (PDF)</label>

                    <input type="file" id="certificate" accept=".pdf">

                </div>

            </div>

            <button type="submit">

                Register

            </button>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
